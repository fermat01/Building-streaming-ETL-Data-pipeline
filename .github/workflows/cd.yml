name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase GHCR image prefix
        id: image
        shell: bash
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/airflow:${{ github.ref_name }}

      - name: Build and publish Spark image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.spark
          push: true
          tags: ${{ steps.image.outputs.prefix }}/spark:${{ github.ref_name }}