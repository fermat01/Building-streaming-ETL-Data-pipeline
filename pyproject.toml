[project]
name = "building-streaming-etl-data-pipeline"
version = "0.1.0"
description = "Real-time streaming ETL data pipeline using Kafka, Spark, Airflow, and MinIO."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "requests",
    "json5",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow==2.7.3",
    "confluent-kafka[avro]==2.5.3",
    "statsd==4.0.1",
]

spark = [
    "fastavro==1.9.7",
    "pyspark==3.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]